<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕГА сайт</title>
    <style>
        body {
            padding: 10px 20px;
        }
        .center{
            display: grid;
            justify-items: center;
            align-items: start;
            height: 100vh;
        }
        ul.hr {
            margin: 0;
            padding: 4px;
        }
        ul.hr li {
            display: inline;
            margin-right: 30px;
            padding: 3px;
   }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
    </style>
</head>
<body>
    <header>
        <img src="assets/icons/logo.png" alt="logotip">
        <hr>
        <ul class="hr">
            <li>Plant pots</li>
            <li>Ceramics</li>
            <li>Tables</li>
            <li>Chairs</li>
            <li>Crockery</li>
            <li>Tableware</li>
            <li>Cutlery</li>
        </ul>
    </header>
    <main>
         <p class="products-grid">
        <img src="assets/img/Photo (1).png" alt="Фотография 1" >
        <img src="assets/img/Photo (2).png" alt="Фотография 2" >
        <img src="assets/img/Photo (3).png" alt="Фотография 3" >
        <img src="assets/img/Photo.png" alt="Фотография 4">
        </p>
    </main>
    <footer></footer>
</body>
</html>
